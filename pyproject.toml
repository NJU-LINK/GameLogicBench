[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geb"
version = "0.1.0"
description = "Game Engineer Bench — deterministic black-box game-dev agent benchmark with a perturbation difficulty ladder"
requires-python = ">=3.10"
dependencies = [
  "docker>=7.0.0",
  "hydra-core>=1.3.0",
  "omegaconf>=2.3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# Price-table source for scripts/cost.py (without it the cost column is all n/a;
# token accounting still works).
cost = [
  "litellm>=1.95",
]

[project.scripts]
geb = "geb.cli:main"

[tool.setuptools.packages.find]
include = ["geb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
